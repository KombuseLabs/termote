# kai's builds of this fork (branch kai): a tag vX.Y.Z-kai.N on that branch
# builds termote for Linux (the guests of kai's workspaces) and publishes
# termote-X.Y.Z-kai.N-linux-<arch>.tar.gz with its .sha256 and a
# checksums.txt as a release. The binary reports the upstream version X.Y.Z
# (the PWA it embeds compares its own version with the server's).
# `kai tool import termote <bin/termote>` takes the program from the archive.
name: kai release

on:
  push:
    tags: ["v*-kai.*"]

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      upstream: ${{ steps.version.outputs.upstream }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Version from the tag, which must be on branch kai
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*-kai.[0-9]*) ;;
            *) echo "::error::tag $TAG is not vX.Y.Z-kai.N"; exit 1 ;;
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/kai ||
            { echo "::error::$TAG is not on branch kai"; exit 1; }
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream=${version%%-kai.*}" >> "$GITHUB_OUTPUT"

  build-pwa:
    name: Build PWA
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter termote...

      - name: Test what kai changed
        working-directory: pwa
        run: pnpm exec vitest run src/hooks/use-update-check.test.ts

      - name: Build
        working-directory: pwa
        run: pnpm build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-dist
          path: pwa/dist
          retention-days: 1

  build:
    name: Build linux-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [prepare, build-pwa]
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pwa-dist
          path: server/webui/dist

      - name: Test what kai changed
        if: matrix.goarch == 'amd64'
        working-directory: server
        run: go test -count=1 -run 'TestListenUnixSocket|TestContentSecurityPolicy|TestServeConfigFromEnv|TestServeSecurityHeaders' .

      - name: Build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          test -f server/webui/dist/index.html
          name="termote-${VERSION}-linux-${GOARCH}"
          mkdir -p "pkg/$name/bin" out
          (cd server && go mod verify)
          (cd server && go build -ldflags="-s -w -X main.cliVersion=${UPSTREAM}" -o "../pkg/$name/bin/termote" .)
          cp LICENSE "pkg/$name/"
          tar -C pkg -czf "out/$name.tar.gz" "$name"
          (cd out && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termote-linux-${{ matrix.goarch }}
          path: out/*
          retention-days: 1

  check-version:
    name: Check the binary's version
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: termote-linux-amd64
          path: artifacts

      - name: Run it
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
        run: |
          tar -xzf "artifacts/termote-${VERSION}-linux-amd64.tar.gz"
          got=$("termote-${VERSION}-linux-amd64/bin/termote" --version)
          [ "$got" = "Termote v${UPSTREAM}" ] || { echo "::error::it says $got"; exit 1; }

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [prepare, build, check-version]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: termote-linux-*
          path: out
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
        run: |
          cd out
          sha256sum termote-*.tar.gz > checksums.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "termote $VERSION (kai)" --latest=false \
            --notes "kai's build of Termote $UPSTREAM (branch kai) for the guests of kai's workspaces. Unpack and run \`kai tool import termote termote-$VERSION-linux-<arch>/bin/termote\`." \
            termote-*.tar.gz termote-*.tar.gz.sha256 checksums.txt
